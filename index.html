<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUQUET DIAGNOSIS — NOUÉRIS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --off-white: #f2ede8;
    --warm-white: #e8e0d8;
    --burgundy-light: #8b2a2a;
    --gold: #9a8060;
    --gray-light: #6a6a6a;
    --border: #2a2a2a;
    --red-label: #e06060;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--off-white);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 200;
    letter-spacing: 0.08em;
    min-height: 100vh;
  }

  /* OPENING */
  #opening {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
    position: relative;
    overflow: hidden;
  }

  #opening::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(92,26,26,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(154,128,96,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .opening-brand {
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--gold);
    margin-bottom: 60px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.3s;
  }

  .opening-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(42px, 8vw, 80px);
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.6s;
  }

  .opening-title em {
    font-style: italic;
    color: var(--warm-white);
  }

  .opening-subtitle {
    font-weight: 200;
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--warm-white);
    margin-bottom: 80px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.9s;
  }

  .opening-desc {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--warm-white);
    text-align: center;
    max-width: 480px;
    line-height: 2;
    margin-bottom: 80px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.2s;
  }

  .opening-meta {
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--warm-white);
    margin-bottom: 60px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.4s;
  }

  .btn-start {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.5em;
    padding: 18px 60px;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.6s;
    position: relative;
    overflow: hidden;
  }

  .btn-start::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: var(--gold);
    transition: left 0.4s ease;
    z-index: -1;
  }

  .btn-start:hover { color: var(--black); }
  .btn-start:hover::before { left: 0; }

  /* QUIZ */
  #quiz {
    display: none;
    min-height: 100vh;
    padding: 80px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0;
    padding-bottom: 20px;
  }

  .quiz-progress-track {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 80px;
    position: relative;
  }

  .quiz-progress-fill {
    height: 1px;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }

  .quiz-brand {
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--gold);
    font-weight: 300;
  }

  .quiz-counter {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--warm-white);
  }

  .block-label {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: var(--red-label);
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards;
  }

  .question-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 300;
    line-height: 1.7;
    color: var(--off-white);
    margin-bottom: 60px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  .scale-container {
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .scale-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--warm-white);
  }

  .scale-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .scale-btn {
    width: 52px;
    height: 52px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--warm-white);
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scale-btn:hover { border-color: var(--gold); color: var(--gold); }
  .scale-btn.selected { background: var(--gold); border-color: var(--gold); color: var(--black); }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 60px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.3s;
  }

  .btn-nav {
    background: transparent;
    border: none;
    color: var(--warm-white);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.4em;
    cursor: pointer;
    transition: color 0.3s ease;
    padding: 10px 0;
  }

  .btn-nav:hover { color: var(--off-white); }
  .btn-nav:disabled { opacity: 0.2; cursor: default; }

  .btn-next {
    background: transparent;
    border: 1px solid var(--off-white);
    color: var(--off-white);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.4em;
    cursor: pointer;
    padding: 14px 40px;
    transition: all 0.3s ease;
  }

  .btn-next:hover { background: var(--off-white); color: var(--black); }
  .btn-next:disabled { opacity: 0.2; cursor: default; }

  /* RESULT */
  #result {
    display: none;
    min-height: 100vh;
    padding: 80px 40px;
    max-width: 720px;
    margin: 0 auto;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 80px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .result-brand { font-size: 13px; letter-spacing: 0.5em; color: var(--gold); font-weight: 300; }
  .result-label { font-size: 11px; letter-spacing: 0.5em; color: var(--red-label); margin-bottom: 20px; }

  .result-type-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(56px, 10vw, 100px);
    font-weight: 300;
    letter-spacing: 0.1em;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-subtype { font-size: 12px; letter-spacing: 0.5em; color: var(--gold); margin-bottom: 12px; }

  .result-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: var(--warm-white);
    margin-bottom: 60px;
  }

  .result-divider { width: 40px; height: 1px; background: var(--gold); margin-bottom: 40px; }
  .result-tagline { font-size: 10px; letter-spacing: 0.4em; color: var(--gold); margin-bottom: 20px; }

  .result-catch {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    line-height: 1.8;
    color: var(--off-white);
    margin-bottom: 40px;
  }

  .result-analysis {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    line-height: 2;
    color: var(--warm-white);
    margin-bottom: 40px;
    padding: 30px;
    border-left: 1px solid var(--burgundy-light);
  }

  .result-advice-label { font-size: 10px; letter-spacing: 0.5em; color: var(--gray-light); margin-bottom: 16px; }

  .result-advice {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    line-height: 2;
    color: var(--warm-white);
    margin-bottom: 60px;
  }

  .result-dream {
    padding: 40px;
    border: 1px solid var(--border);
    margin-bottom: 60px;
    position: relative;
  }

  .result-dream::before {
    content: 'YOUR DREAM';
    position: absolute;
    top: -6px; left: 30px;
    font-size: 9px;
    letter-spacing: 0.4em;
    color: var(--gold);
    background: var(--black);
    padding: 0 10px;
  }

  .result-dream-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    line-height: 2;
    color: var(--off-white);
  }

  .result-cta {
    text-align: center;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  .result-cta-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--gray-light);
    margin-bottom: 30px;
  }

  .btn-retry {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gray-light);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 200;
    font-size: 10px;
    letter-spacing: 0.4em;
    cursor: pointer;
    padding: 14px 40px;
    transition: all 0.3s ease;
    margin-right: 16px;
  }

  .btn-retry:hover { border-color: var(--off-white); color: var(--off-white); }

  .btn-contact {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Josefin Sans', sans-serif;
    font-weight: 200;
    font-size: 10px;
    letter-spacing: 0.4em;
    cursor: pointer;
    padding: 14px 40px;
    transition: all 0.3s ease;
  }

  .btn-contact:hover { background: var(--gold); color: var(--black); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    #opening, #quiz, #result { padding: 60px 24px; }
    .scale-btn { width: 44px; height: 44px; font-size: 16px; }
    .scale-buttons { gap: 8px; }
  }
</style>
</head>
<body>



<!-- OPENING -->
<div id="opening">
  <div class="opening-brand">NOUÉRIS</div>
  <div class="opening-title">BOUQUET<br><em>Diagnosis</em></div>
  <div class="opening-subtitle">YOUR BOUQUET STYLE FINDER</div>
  <div class="opening-desc">
    あなたが叶えたい結婚式の夢から、<br>
    あなただけのブーケスタイルを導き出します。
  </div>
  <div class="opening-meta">22 QUESTIONS — 16 TYPES</div>
  <button class="btn-start" onclick="startQuiz()">BEGIN</button>
</div>

<!-- QUIZ -->
<div id="quiz">
  <div class="quiz-header">
    <div class="quiz-brand">NOUÉRIS</div>
    <div class="quiz-counter" id="counter">01 / 22</div>
  </div>
  <div class="quiz-progress-track">
    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
  </div>
  <div class="block-label" id="block-label"></div>
  <div class="question-text" id="question-text"></div>
  <div class="scale-container">
    <div class="scale-labels">
      <span class="scale-label">全くそう思わない</span>
      <span class="scale-label">とてもそう思う</span>
    </div>
    <div class="scale-buttons">
      <button class="scale-btn" onclick="selectAnswer(1)">1</button>
      <button class="scale-btn" onclick="selectAnswer(2)">2</button>
      <button class="scale-btn" onclick="selectAnswer(3)">3</button>
      <button class="scale-btn" onclick="selectAnswer(4)">4</button>
      <button class="scale-btn" onclick="selectAnswer(5)">5</button>
    </div>
  </div>
  <div class="nav-buttons">
    <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">← BACK</button>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>NEXT →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result">
  <div class="result-header">
    <div class="result-brand">NOUÉRIS</div>
    <div style="font-size:11px;letter-spacing:0.3em;color:var(--gray-light)">YOUR RESULT</div>
  </div>
  <div class="result-label">YOUR BOUQUET TYPE</div>
  <div class="result-type-name" id="result-type"></div>
  <div class="result-subtype" id="result-subtype"></div>
  <div class="result-subtitle" id="result-subtitle"></div>
  <div class="result-divider"></div>
  <div class="result-tagline">ONE LINE</div>
  <div class="result-catch" id="result-catch"></div>
  <div class="result-analysis" id="result-analysis"></div>
  <div class="result-advice-label">BOUQUET ADVICE</div>
  <div class="result-advice" id="result-advice"></div>
  <div class="result-dream">
    <div class="result-dream-text" id="result-dream"></div>
  </div>
  <div class="result-cta">
    <div class="result-cta-text">あなたのブーケを、一緒に作りましょう。</div>
    <button class="btn-retry" onclick="retryQuiz()">RETRY</button>
    <button class="btn-contact">CONTACT NOUÉRIS</button>
  </div>
</div>

<script>

let currentQ = 0;
let answers = new Array(22).fill(null);

function startQuiz() {
  document.getElementById('opening').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const blockLabel = document.getElementById('block-label');
  const questionText = document.getElementById('question-text');

  blockLabel.style.animation = 'none';
  questionText.style.animation = 'none';
  setTimeout(() => {
    blockLabel.style.animation = '';
    questionText.style.animation = '';
  }, 10);

  blockLabel.textContent = q.block;
  questionText.textContent = q.text;
  document.getElementById('counter').textContent = String(currentQ + 1).padStart(2, '0') + ' / 22';

  document.querySelectorAll('.scale-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', answers[currentQ] === i + 1);
  });

  document.getElementById('btn-next').disabled = answers[currentQ] === null;
  document.getElementById('btn-prev').disabled = false;
  document.getElementById('quiz-progress-fill').style.width = ((currentQ + 1) / 22 * 100) + '%';
}

function selectAnswer(val) {
  answers[currentQ] = val;
  document.querySelectorAll('.scale-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i + 1 === val);
  });
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  if (currentQ < 21) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  } else {
    document.getElementById('quiz').style.display = 'none';
    document.getElementById('quiz-progress-fill').style.width = '0%';
    answers = new Array(22).fill(null);
    currentQ = 0;
    document.getElementById('opening').style.display = 'flex';
  }
}

function calculateResult() {
  let a1 = [], a2 = [], a3 = [], a4 = [], a6 = [];

  answers.forEach((ans, i) => {
    const s = scoring[i];
    const score = s.reverse ? (6 - ans) : ans;
    if (s.axis === 1) a1.push(score);
    else if (s.axis === 2) a2.push(score);
    else if (s.axis === 3) a3.push(score);
    else if (s.axis === 4) a4.push(score);
    else if (s.axis === 6) a6.push(score);
  });

  const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  const avg1 = avg(a1);
  const avg2 = avg(a2);
  const avg3 = avg(a3);
  const avg4 = avg(a4);
  const avg6 = avg(a6);

  // 軸3（直感/熟考）で軸6を微補正
  const bias3 = (avg3 - 3) * 0.15;
  // 軸4（自分/人）で軸6を微補正
  const bias4 = (avg4 - 3) * 0.15;
  const adj6 = avg6 + bias3 + bias4;

  // 大タイプ判定（軸1×軸2）
  let mainType;
  if (avg1 <= 3 && avg2 <= 3) mainType = 'ECHO';
  else if (avg1 <= 3 && avg2 > 3) mainType = 'STILL';
  else if (avg1 > 3 && avg2 <= 3) mainType = 'SPARK';
  else mainType = 'REIGN';

  // サブタイプ判定（軸1×軸6）
  const isHigh1 = avg1 > 3;   // 高=空気を変えたい
  const isHigh6 = adj6 > 3;   // 高=美意識貫く
  let subType;
  if (!isHigh1 && isHigh6)  subType = 'INSTINCT'; // 心に残りたい×美意識貫く
  else if (isHigh1 && isHigh6)  subType = 'IMPULSE';  // 空気を変えたい×美意識貫く
  else if (!isHigh1 && !isHigh6) subType = 'INTENT';   // 心に残りたい×調和重視
  else subType = 'IMPACT';                              // 空気を変えたい×調和重視

  return types[`${mainType}-${subType}`];
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  const result = calculateResult();
  document.getElementById('result-type').textContent = result.type;
  document.getElementById('result-subtype').textContent = '— ' + result.sub + ' —';
  document.getElementById('result-subtitle').textContent = result.subtitle;
  document.getElementById('result-catch').textContent = result.catch;
  document.getElementById('result-analysis').textContent = result.analysis;
  document.getElementById('result-advice').textContent = result.advice;
  document.getElementById('result-dream').textContent = result.dream;
  document.getElementById('result').style.display = 'block';
  window.scrollTo(0, 0);
}

function retryQuiz() {
  currentQ = 0;
  answers = new Array(22).fill(null);
  document.getElementById('result').style.display = 'none';
  document.getElementById('opening').style.display = 'flex';
  document.getElementById('quiz-progress-fill').style.width = '0%';
}
